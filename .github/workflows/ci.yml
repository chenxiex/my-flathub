name: Flatpak 持续集成

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: 构建并验证 x86_64/stable
        runs-on: ubuntu-24.04
        container:
            image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:d6975c0cabef8467b1729461c8268ac336936671db30f3f825ba0ed4de6a5425
            options: --privileged
        env:
            FLATPAK_ARCH: x86_64
            FLATPAK_BRANCH: stable
        steps:
            - name: 检出仓库
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # 固定为 v5 对应提交

            - name: 缓存 Flatpak Builder 状态
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # 固定为 v4 对应提交
              with:
                  path: .flatpak-builder
                  key: flatpak-builder-25.08-x86_64-${{ hashFiles('packages/**') }}
                  restore-keys: |
                      flatpak-builder-25.08-x86_64-

            - name: 构建全部软件包
              run: bash scripts/build-repo.sh

            - name: 验证仓库并对示例执行冒烟测试
              run: bash tests/verify-repo.sh
