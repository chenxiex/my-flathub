app-id: io.github._2dust.v2rayN
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: v2rayn-flatpak
finish-args:
    - --share=network
    - --share=ipc
    - --socket=x11
    - --device=dri
    - --talk-name=org.kde.StatusNotifierWatcher
    # 上游 Avalonia 托盘的 D-Bus 名称含动态 PID 和实例编号；Flatpak 不接受 Item-* 模式。
    - --own-name=org.kde.*
    - --talk-name=org.freedesktop.Flatpak

modules:
    - name: v2rayn
      buildsystem: simple
      build-commands:
          - install -d /app/lib/v2rayN /app/bin /app/share/applications /app/share/metainfo /app/share/icons/hicolor/256x256/apps
          # Flatpak Builder 会自动剥离归档唯一的顶层目录。
          - cp -a v2rayN bin libHarfBuzzSharp.so libSkiaSharp.so libe_sqlite3.so v2rayN.png /app/lib/v2rayN/
          # GUI 本体必须由 Flatpak 更新，不能执行上游便携版的原地升级工具。
          - chmod 755 /app/lib/v2rayN/v2rayN /app/lib/v2rayN/bin/xray/xray /app/lib/v2rayN/bin/sing_box/sing-box /app/lib/v2rayN/bin/mihomo/mihomo
          - install -m755 v2rayn-flatpak.sh /app/bin/v2rayn-flatpak
          - install -m755 host-proxy-command.sh /app/bin/host-proxy-command
          - ln -s host-proxy-command /app/bin/gsettings
          - ln -s host-proxy-command /app/bin/kwriteconfig5
          - ln -s host-proxy-command /app/bin/kwriteconfig6
          - ln -s host-proxy-command /app/bin/dbus-send
          - install -m644 io.github._2dust.v2rayN.desktop /app/share/applications/io.github._2dust.v2rayN.desktop
          - install -m644 io.github._2dust.v2rayN.metainfo.xml /app/share/metainfo/io.github._2dust.v2rayN.metainfo.xml
          - install -m644 /app/lib/v2rayN/v2rayN.png /app/share/icons/hicolor/256x256/apps/io.github._2dust.v2rayN.png
      sources:
          - type: archive
            url: https://github.com/2dust/v2rayN/releases/download/7.24.9/v2rayN-linux-64.zip
            sha256: 8847f77fc1f7e8f9afed0790707326ec6685f7c3f10b63dd7a43772f4bfe5fef
            x-checker-data:
                type: json
                url: https://api.github.com/repos/2dust/v2rayN/releases/latest
                version-query: .tag_name
                url-query: .assets[] | select(.name == "v2rayN-linux-64.zip") | .browser_download_url
                release-url-template: https://github.com/2dust/v2rayN/releases/tag/$version
                is-main-source: true
          - type: file
            path: v2rayn-flatpak.sh
          - type: file
            path: host-proxy-command.sh
          - type: file
            path: io.github._2dust.v2rayN.desktop
          - type: file
            path: io.github._2dust.v2rayN.metainfo.xml
